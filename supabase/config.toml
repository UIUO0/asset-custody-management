# Supabase local development config — ORG internal deployment
# Started with `supabase start` (requires Docker Desktop running).
project_id = "shelf-org"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local mail-catcher (Mailpit): password-reset / OTP emails land here (no SMTP needed)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/reset-password", "http://localhost:3000/oauth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Signup is handled by the app (DISABLE_SIGNUP) — accounts are seeded/invited
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Seeded accounts are created pre-confirmed via the service role
enable_confirmations = false

[analytics]
enabled = false
